function isPlainObject(val) {
  return val && typeof val === 'object' && !Array.isArray(val);
}
function stringifyCell(val) {
  if (val === null || val === undefined) return '';
  if (typeof val === 'string') return val;
  if (typeof val === 'number' || typeof val === 'boolean') return String(val);
  try {
    if (Array.isArray(val)) {
      if (val.length === 0) return '[]';
      if (val.every(x => typeof x === 'string' || typeof x === 'number')) {
        return val.slice(0,5).join(', ') + (val.length>5 ? '…' : '');
      }
    }
    const small = JSON.stringify(val, null, 0);
    return small.length > 80 ? small.slice(0,80) + '…' : small;
  } catch(e) {
    return String(val);
  }
}

// ---------- state ----------
let rawData = FALLBACK_DATA;
let visibleData = [];
let columns = [];
let sortState = { key: null, dir: null };
let filters = {};

// ---------- initialize ----------
function init() {
  const msg = document.getElementById('loading-msg');
  msg && msg.remove();
  prepareColumns();
  applyFiltersAndRender();
}

// ---------- columns ----------
function prepareColumns() {
  if (!rawData || rawData.length === 0) return;
  const sample = rawData[0];
  const preferred = ['firm','website','location','headquarters','industry','lead_score','employee_count','validated_linkedins'];
  const keys = new Set(Object.keys(sample));
  columns = [];
  preferred.forEach(k => { if (keys.has(k)) { columns.push({key:k,title:k,type:guessType(sample[k])}); keys.delete(k);} });
  Array.from(keys).sort().forEach(k => columns.push({key:k,title:k,type:guessType(sample[k])}));
}
function guessType(v) {
  if (typeof v === 'number') return 'number';
  if (Array.isArray(v)) return 'array';
  if (isPlainObject(v)) return 'object';
  return 'string';
}

// ---------- filtering, sorting, rendering ----------
function applyFiltersAndRender() {
  visibleData = rawData.filter(item => {
    for (const key in filters) {
      const q = filters[key].trim().toLowerCase();
      if (!q) continue;
      const cell = stringifyCell(item[key] ?? '');
      if (!cell.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  if (sortState.key && sortState.dir) {
    const k = sortState.key;
    const dir = sortState.dir === 'asc' ? 1 : -1;
    visibleData.sort((a,b)=>compareCells(a[k],b[k])*dir);
  }

  renderTable();
}
function compareCells(a,b){
  const as=stringifyCell(a).toLowerCase(), bs=stringifyCell(b).toLowerCase();
  if(as<bs)return-1;if(as>bs)return 1;return 0;
}

// ---------- render table ----------
function renderTable(){
  const wrap=document.getElementById('table-area');
  wrap.innerHTML='';
  if(!columns.length){wrap.innerHTML='<div class="no-data">No data.</div>';return;}
  const table=document.createElement('table');
  const thead=document.createElement('thead');
  const tr=document.createElement('tr');

  const thView=document.createElement('th');
  thView.style.width='90px';
  thView.innerHTML='<div class="col-head"><span class="title">View</span></div>';
  tr.appendChild(thView);

  columns.forEach(col=>{
    const th=document.createElement('th');
    const initW=Math.min(200,Math.max(110,col.title.length*12));
    th.style.width=initW+'px';
    th.setAttribute('data-key',col.key);

    const head=document.createElement('div');
    head.className='col-head';
    const title=document.createElement('div');
    title.className='title';
    title.textContent=col.title;
    head.appendChild(title);

    const actions=document.createElement('div');
    actions.className='actions';
    const sortBtn=document.createElement('div');
    sortBtn.className='sort-btn';
    updateSortBtnUI(sortBtn,col.key);
    sortBtn.addEventListener('click',()=>{
      toggleSort(col.key);
      document.querySelectorAll('.sort-btn').forEach(elem=>{
        updateSortBtnUI(elem,elem.parentElement.parentElement.getAttribute('data-key'));
      });
    });
    actions.appendChild(sortBtn);
    head.appendChild(actions);
    th.appendChild(head);

    const filterDiv=document.createElement('div');
    filterDiv.className='filter';
    const input=document.createElement('input');
    input.type='text';
    input.placeholder='Filter...';
    input.value=filters[col.key]||'';
    input.addEventListener('input',e=>{
      filters[col.key]=e.target.value;
      applyFiltersAndRender();
    });
    filterDiv.appendChild(input);
    th.appendChild(filterDiv);

    const resizer=document.createElement('div');
    resizer.className='resizer';
    setupColumnResizer(th,resizer);
    th.appendChild(resizer);
    tr.appendChild(th);
  });

  thead.appendChild(tr);
  table.appendChild(thead);

  const tbody=document.createElement('tbody');
  if(visibleData.length===0){
    const trEmpty=document.createElement('tr');
    const tdEmpty=document.createElement('td');
    tdEmpty.colSpan=columns.length+1;
    tdEmpty.innerHTML='<div style="padding:20px"><strong>No rows match filters</strong><div class="small-muted">Clear filters to view all leads</div></div>';
    trEmpty.appendChild(tdEmpty);
    tbody.appendChild(trEmpty);
  }else{
    visibleData.forEach(row=>{
      const trRow=document.createElement('tr');
      const tdView=document.createElement('td');
      tdView.style.width='90px';
      const vbtn=document.createElement('button');
      vbtn.className='view-btn';
      vbtn.textContent='View';
      vbtn.addEventListener('click',()=>openDetailPage(row));
      tdView.appendChild(vbtn);
      trRow.appendChild(tdView);

      columns.forEach(col=>{
        const td=document.createElement('td');
        const val=row[col.key];
        const span=document.createElement('span');
        span.className='cell';
        span.title=stringifyCell(val);
        span.textContent=stringifyCell(val);
        td.appendChild(span);
        trRow.appendChild(td);
      });

      tbody.appendChild(trRow);
    });
  }

  table.appendChild(tbody);
  wrap.appendChild(table);
}

// ---------- sorting ----------
function toggleSort(key){
  if(sortState.key!==key){sortState.key=key;sortState.dir='asc';}
  else{
    if(sortState.dir==='asc')sortState.dir='desc';
    else if(sortState.dir==='desc'){sortState.key=null;sortState.dir=null;}
    else sortState.dir='asc';
  }
  applyFiltersAndRender();
}
function updateSortBtnUI(btnElem,key){
  const active=sortState.key===key&&sortState.dir;
  btnElem.classList.toggle('active',active);
  if(!active)btnElem.textContent='⇅';
  else btnElem.textContent=sortState.dir==='asc'?'↑':'↓';
}

// ---------- column resizing ----------
function setupColumnResizer(th,handle){
  let startX,startWidth;
  handle.addEventListener('mousedown',function(e){
    e.preventDefault();
    startX=e.clientX;
    startWidth=th.getBoundingClientRect().width;
    document.body.style.cursor='col-resize';
    function onMouseMove(ev){
      const dx=ev.clientX-startX;
      let newW=Math.max(60,startWidth+dx);
      th.style.width=newW+'px';
    }
    function onMouseUp(){
      document.removeEventListener('mousemove',onMouseMove);
      document.removeEventListener('mouseup',onMouseUp);
      document.body.style.cursor='';
    }
    document.addEventListener('mousemove',onMouseMove);
    document.addEventListener('mouseup',onMouseUp);
  });
}

// ---------- open detail ----------
function openDetailPage(row){
  const id='lead_'+(row.sequence||Math.random().toString(36).slice(2));
  sessionStorage.setItem(id,JSON.stringify(row));
  const url='lead_detail.html?id='+encodeURIComponent(id);
  window.open(url,'_blank');
}

// ---------- controls ----------
document.getElementById('btn-reset-filters').addEventListener('click',()=>{
  filters={};sortState={key:null,dir:null};
  document.querySelectorAll('thead input[type="text"]').forEach(i=>i.value='');
  applyFiltersAndRender();
});
let wrapText=false;
document.getElementById('btn-toggle-wrap').addEventListener('click',()=>{
  wrapText=!wrapText;
  document.querySelectorAll('.cell').forEach(c=>{
    if(wrapText){c.style.whiteSpace='normal';c.style.maxWidth='none';}
    else{c.style.whiteSpace='nowrap';c.style.maxWidth='var(--max-initial-col)';}
  });
});
document.getElementById('btn-download-json').addEventListener('click',()=>{
  const dataStr=JSON.stringify(visibleData,null,2);
  const blob=new Blob([dataStr],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='leads_visible.json';
  document.body.appendChild(a);
  a.click();a.remove();URL.revokeObjectURL(url);
});

// ---------- run ----------
init();
</script>
</body>

    padding:6px 8px;
    border-radius:6px;
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 13px;
    background: rgba(255,255,255,0.03);
    color: var(--header-fg);
  }

  tbody td {
    padding: 8px;
    border-bottom: 1px solid #eef3f6;
    font-size: 13px;
    vertical-align: top;
  }

  tbody tr:hover { background: var(--row-hover); }

  .cell {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    max-width: var(--max-initial-col);
    display: block;
  }

  .view-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding:6px 8px;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
    font-size:13px;
  }

  .resizer {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    width: 8px;
    cursor: col-resize;
    z-index: 5;
    user-select: none;
  }

  .resizer::after {
    content: "";
    display:block;
    position: absolute;
    right: 3px;
    top: 25%;
    bottom: 25%;
    width: 1px;
    background: rgba(255,255,255,0.12);
  }

  .small-muted {
    font-size: 12px;
    color: var(--muted);
  }

  .controls {
    margin-left:auto;
    display:flex;
    gap:8px;
    align-items:center;
  }

  .btn {
    padding:6px 10px;
    border-radius:6px;
    background:#fff;
    border:1px solid #e6eef4;
    cursor:pointer;
    font-size:13px;
  }

  .no-data {
    padding: 36px;
    text-align: center;
  }

  @media (max-width: 800px) {
    table { min-width: 700px; }
    thead input[type="text"] { font-size:12px; }
  }
</style>

function isPlainObject(val) {
  return val && typeof val === 'object' && !Array.isArray(val);
}
function stringifyCell(val) {
  if (val === null || val === undefined) return '';
  if (typeof val === 'string') return val;
  if (typeof val === 'number' || typeof val === 'boolean') return String(val);
  try {
    if (Array.isArray(val)) {
      if (val.length === 0) return '[]';
      if (val.every(x => typeof x === 'string' || typeof x === 'number')) {
        return val.slice(0,5).join(', ') + (val.length>5 ? '…' : '');
      }
    }
    const small = JSON.stringify(val, null, 0);
    return small.length > 80 ? small.slice(0,80) + '…' : small;
  } catch(e) {
    return String(val);
  }
}

// ---------- state ----------
let rawData = FALLBACK_DATA;
let visibleData = [];
let columns = [];
let sortState = { key: null, dir: null };
let filters = {};

// ---------- initialize ----------
function init() {
  const msg = document.getElementById('loading-msg');
  msg && msg.remove();
  prepareColumns();
  applyFiltersAndRender();
}

// ---------- columns ----------
function prepareColumns() {
  if (!rawData || rawData.length === 0) return;
  const sample = rawData[0];

  // 👇 new preferred column order
  const preferred = [
    'sequence',
    'firm',
    'enr_rank_2025',
    'total_revenue_m',
    'lead_score',
    'relevance_score',
    'completeness_score',
    'website',
    'industry',
    'founded_year',
    'country',
    'location',
    'water_supply_pct'
  ];

  const keys = new Set(Object.keys(sample));
  columns = [];

  // Add preferred columns first (in this order)
  preferred.forEach(k => {
    if (keys.has(k)) {
      columns.push({ key: k, title: k, type: guessType(sample[k]) });
      keys.delete(k);
    }
  });

  // Add any remaining columns alphabetically
  Array.from(keys)
    .sort()
    .forEach(k => columns.push({ key: k, title: k, type: guessType(sample[k]) }));
}
function guessType(v) {
  if (typeof v === 'number') return 'number';
  if (Array.isArray(v)) return 'array';
  if (isPlainObject(v)) return 'object';
  return 'string';
}

// ---------- filtering, sorting, rendering ----------
function applyFiltersAndRender() {
  visibleData = rawData.filter(item => {
    for (const key in filters) {
      const q = filters[key].trim().toLowerCase();
      if (!q) continue;
      const cell = stringifyCell(item[key] ?? '');
      if (!cell.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  if (sortState.key && sortState.dir) {
    const k = sortState.key;
    const dir = sortState.dir === 'asc' ? 1 : -1;
    visibleData.sort((a,b)=>compareCells(a[k],b[k])*dir);
  }

  renderTable();
}
function compareCells(a,b){
  const as=stringifyCell(a).toLowerCase(), bs=stringifyCell(b).toLowerCase();
  if(as<bs)return-1;if(as>bs)return 1;return 0;
}

// ---------- render table ----------
function renderTable(){
  const wrap=document.getElementById('table-area');
  wrap.innerHTML='';
  if(!columns.length){wrap.innerHTML='<div class="no-data">No data.</div>';return;}
  const table=document.createElement('table');
  const thead=document.createElement('thead');
  const tr=document.createElement('tr');

  const thView=document.createElement('th');
  thView.style.width='90px';
  thView.innerHTML='<div class="col-head"><span class="title">View</span></div>';
  tr.appendChild(thView);

  columns.forEach(col=>{
    const th=document.createElement('th');
    const initW=Math.min(200,Math.max(110,col.title.length*12));
    th.style.width=initW+'px';
    th.setAttribute('data-key',col.key);

    const head=document.createElement('div');
    head.className='col-head';
    const title=document.createElement('div');
    title.className='title';
    title.textContent=col.title;
    head.appendChild(title);

    const actions=document.createElement('div');
    actions.className='actions';
    const sortBtn=document.createElement('div');
    sortBtn.className='sort-btn';
    updateSortBtnUI(sortBtn,col.key);
    sortBtn.addEventListener('click',()=>{
      toggleSort(col.key);
      document.querySelectorAll('.sort-btn').forEach(elem=>{
        updateSortBtnUI(elem,elem.parentElement.parentElement.getAttribute('data-key'));
      });
    });
    actions.appendChild(sortBtn);
    head.appendChild(actions);
    th.appendChild(head);

    const filterDiv=document.createElement('div');
    filterDiv.className='filter';
    const input=document.createElement('input');
    input.type='text';
    input.placeholder='Filter...';
    input.value=filters[col.key]||'';
    input.addEventListener('input',e=>{
      filters[col.key]=e.target.value;
      applyFiltersAndRender();
    });
    filterDiv.appendChild(input);
    th.appendChild(filterDiv);

    const resizer=document.createElement('div');
    resizer.className='resizer';
    setupColumnResizer(th,resizer);
    th.appendChild(resizer);
    tr.appendChild(th);
  });

  thead.appendChild(tr);
  table.appendChild(thead);

  const tbody=document.createElement('tbody');
  if(visibleData.length===0){
    const trEmpty=document.createElement('tr');
    const tdEmpty=document.createElement('td');
    tdEmpty.colSpan=columns.length+1;
    tdEmpty.innerHTML='<div style="padding:20px"><strong>No rows match filters</strong><div class="small-muted">Clear filters to view all leads</div></div>';
    trEmpty.appendChild(tdEmpty);
    tbody.appendChild(trEmpty);
  }else{
    visibleData.forEach(row=>{
      const trRow=document.createElement('tr');
      const tdView=document.createElement('td');
      tdView.style.width='90px';
      const vbtn=document.createElement('button');
      vbtn.className='view-btn';
      vbtn.textContent='View';
      vbtn.addEventListener('click',()=>openDetailPage(row));
      tdView.appendChild(vbtn);
      trRow.appendChild(tdView);

      columns.forEach(col=>{
        const td=document.createElement('td');
        const val=row[col.key];
        const span=document.createElement('span');
        span.className='cell';
        span.title=stringifyCell(val);
        span.textContent=stringifyCell(val);
        td.appendChild(span);
        trRow.appendChild(td);
      });

      tbody.appendChild(trRow);
    });
  }

  table.appendChild(tbody);
  wrap.appendChild(table);
}

// ---------- sorting ----------
function toggleSort(key){
  if(sortState.key!==key){sortState.key=key;sortState.dir='asc';}
  else{
    if(sortState.dir==='asc')sortState.dir='desc';
    else if(sortState.dir==='desc'){sortState.key=null;sortState.dir=null;}
    else sortState.dir='asc';
  }
  applyFiltersAndRender();
}
function updateSortBtnUI(btnElem,key){
  const active=sortState.key===key&&sortState.dir;
  btnElem.classList.toggle('active',active);
  if(!active)btnElem.textContent='⇅';
  else btnElem.textContent=sortState.dir==='asc'?'↑':'↓';
}

// ---------- column resizing ----------
function setupColumnResizer(th,handle){
  let startX,startWidth;
  handle.addEventListener('mousedown',function(e){
    e.preventDefault();
    startX=e.clientX;
    startWidth=th.getBoundingClientRect().width;
    document.body.style.cursor='col-resize';
    function onMouseMove(ev){
      const dx=ev.clientX-startX;
      let newW=Math.max(60,startWidth+dx);
      th.style.width=newW+'px';
    }
    function onMouseUp(){
      document.removeEventListener('mousemove',onMouseMove);
      document.removeEventListener('mouseup',onMouseUp);
      document.body.style.cursor='';
    }
    document.addEventListener('mousemove',onMouseMove);
    document.addEventListener('mouseup',onMouseUp);
  });
}

// ---------- open detail ----------
function openDetailPage(row){
  const id='lead_'+(row.sequence||Math.random().toString(36).slice(2));
  sessionStorage.setItem(id,JSON.stringify(row));
  const url='lead_detail.html?id='+encodeURIComponent(id);
  window.open(url,'_blank');
}

// ---------- controls ----------
document.getElementById('btn-reset-filters').addEventListener('click',()=>{
  filters={};sortState={key:null,dir:null};
  document.querySelectorAll('thead input[type="text"]').forEach(i=>i.value='');
  applyFiltersAndRender();
});
let wrapText=false;
document.getElementById('btn-toggle-wrap').addEventListener('click',()=>{
  wrapText=!wrapText;
  document.querySelectorAll('.cell').forEach(c=>{
    if(wrapText){c.style.whiteSpace='normal';c.style.maxWidth='none';}
    else{c.style.whiteSpace='nowrap';c.style.maxWidth='var(--max-initial-col)';}
  });
});
document.getElementById('btn-download-json').addEventListener('click',()=>{
  const dataStr=JSON.stringify(visibleData,null,2);
  const blob=new Blob([dataStr],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='leads_visible.json';
  document.body.appendChild(a);
  a.click();a.remove();URL.revokeObjectURL(url);
});

// ---------- run ----------
init();
</script>
